<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14265a"/>
      <stop offset="1" stop-color="#02040c"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.53" cy="0.56" r="0.45">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBlue" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background so the same art works as a maskable icon -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#bloom)"/>

  <!-- Axis with ticks -->
  <g filter="url(#glowBlue)" stroke-linecap="round">
    <line x1="104" y1="300" x2="408" y2="300" stroke="#3b82f6" stroke-width="16"/>
    <line x1="104" y1="300" x2="408" y2="300" stroke="#ffffff" stroke-width="7"/>
    <g stroke="#ffffff" stroke-width="5">
      <line x1="148" y1="286" x2="148" y2="314"/>
      <line x1="208" y1="290" x2="208" y2="310"/>
      <line x1="328" y1="290" x2="328" y2="310"/>
      <line x1="372" y1="286" x2="372" y2="314"/>
    </g>
    <!-- A saved instant -->
    <line x1="208" y1="196" x2="208" y2="356" stroke="#60a5fa" stroke-width="12" stroke-opacity="0.8"/>
    <line x1="208" y1="196" x2="208" y2="356" stroke="#eef3ff" stroke-width="5"/>
  </g>

  <!-- Now -->
  <g filter="url(#glowRed)" stroke-linecap="round">
    <line x1="284" y1="132" x2="284" y2="384" stroke="#ff4560" stroke-width="20"/>
    <line x1="284" y1="132" x2="284" y2="384" stroke="#ffd0d6" stroke-width="6"/>
  </g>
</svg>
