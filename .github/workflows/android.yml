# Builds the Android app (docs/android.md) and, on main, publishes it as a GitHub Release.
# On pull requests it also publishes "TC Preview", a separate test app that loads a PR's
# Netlify deploy preview, as the "preview" pre-release (or the tag in the TC_PREVIEW_TAG
# repository variable; see the preview job).
#
# It builds only when the push (or the PR update) changed something that goes into the APK
# (the changes job: .github/scripts/apk-inputs-changed.mjs). Web changes never need a new
# APK: the app loads the live site.
#
# Signing: the key lives only in repository secrets (Settings > Secrets and variables >
# Actions), never in the repo:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias in it
#   ANDROID_KEY_PASSWORD       the key's password
# Without them (pull requests from forks, or before they are added) the APK is built
# unsigned: it proves the build works but can't be installed, so nothing signed with
# another key can ever replace the installed app. Releases are only made from a signed build.
name: Android app

on:
  # Branches other than main are built by their pull request.
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'android-offline/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
      - '.github/actions/android-setup/**'
      - '.github/scripts/apk-inputs-changed.mjs'
  pull_request:
    paths:
      - 'android/**'
      - 'android-offline/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
      - '.github/actions/android-setup/**'
      - '.github/scripts/apk-inputs-changed.mjs'
  # Actions > Android app > Run workflow: e.g. on main after adding the signing secrets, or
  # on a branch to publish its TC Preview app.
  workflow_dispatch:
    inputs:
      preview:
        description: Also publish this branch's TC Preview app (the "preview" pre-release)
        type: boolean
        default: false
      preview_tag:
        description: Publish TC Preview under this release tag instead (e.g. preview-2), a new release with its own download link
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Did this push change the APK? A pull request's path filter matches its whole diff, so
  # once a PR touches the native side every later push would rebuild; this compares only
  # what the push added (before..after; a new PR: its whole diff), and the version and
  # Capacitor packages in package.json, not every edit to it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apk: ${{ steps.diff.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Run by hand: build." && echo "apk=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          from="$BEFORE"
          if [ "$EVENT" = pull_request ] && [ "$ACTION" != synchronize ]; then
            from=$(git merge-base "$BASE" "$AFTER" || true)
          fi
          node .github/scripts/apk-inputs-changed.mjs "$from" "$AFTER" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.apk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.apk.outputs.version }}
      signed: ${{ steps.apk.outputs.signed }}
      apk: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/android-setup
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build, test and lint
        working-directory: android
        run: ./gradlew assembleRelease :app:testReleaseUnitTest :app:lintRelease --no-daemon --stacktrace

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          out=android/app/build/outputs/apk/release
          if [ -f "$out/app-release.apk" ]; then
            name="timeline-clock-$version.apk"
            cp "$out/app-release.apk" "$name"
            signed=true
            apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
            "$apksigner" verify --print-certs "$name" | tee signing.txt
          else
            name="timeline-clock-$version-UNSIGNED.apk"
            cp "$out/app-release-unsigned.apk" "$name"
            signed=false
            echo "Unsigned build" > signing.txt
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            ${{ steps.apk.outputs.name }}
            signing.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Is there a release for this version yet?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists: nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to release an unsigned build
        if: steps.check.outputs.exists == 'false' && needs.build.outputs.signed != 'true'
        run: |
          echo "::error::The APK was built without the signing secrets, so it can't be released. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (docs/android.md), then run this workflow on main again."
          exit 1

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.exists == 'false'
        with:
          name: android-apk

      - name: Publish the release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          APK: ${{ needs.build.outputs.apk }}
        run: |
          # This version's CHANGELOG section ("## 0.1.0 ..." up to the next "## ").
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "---"
            echo "Install or update: see [docs/android.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/android.md). Updating keeps your data."
            echo
            echo '```'
            grep -i "SHA-256" signing.txt || true
            echo '```'
          } >> notes.md
          gh release create "v$VERSION" "$APK" --target "$GITHUB_SHA" --title "Timeline Clock $VERSION" --notes-file notes.md

  # TC Preview (docs/android.md): a separate app ("com.micwalk.timelineclock.preview") that
  # asks which pull request's Netlify deploy preview to load, so a PR can be tried on the
  # phone before it reaches main. Published as the "preview" pre-release (never "latest"),
  # updated in place by each build, at a download link that stays the same. Same-repo pull
  # requests only: forks get no secrets.
  # Retarget it to another release (a fresh tag and download link, e.g. "preview-2"): set the
  # TC_PREVIEW_TAG repository variable (Settings > Secrets and variables > Actions > Variables)
  # for every build from then on, or type a tag in Run workflow's preview_tag for one build.
  preview:
    needs: changes
    if: >-
      needs.changes.outputs.apk == 'true' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        || (github.event_name == 'workflow_dispatch' && (inputs.preview || inputs.preview_tag != ''))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: android-preview-release
      cancel-in-progress: false
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      PREVIEW_TAG: ${{ inputs.preview_tag || vars.TC_PREVIEW_TAG || 'preview' }}
    steps:
      - name: Check the release tag
        run: |
          # A plain tag name, and never a version tag: those are the real app's releases.
          if ! [[ "$PREVIEW_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "$PREVIEW_TAG" =~ ^v[0-9] ]]; then
            echo "::error::TC Preview's release tag '$PREVIEW_TAG' must be letters, digits, '.', '-' or '_', and not a version tag (v1.2.3)."
            exit 1
          fi
          echo "TC Preview publishes to the '$PREVIEW_TAG' pre-release."

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - uses: ./.github/actions/android-setup
        id: setup
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Needs the signing key
        if: steps.setup.outputs.signed != 'true'
        run: |
          echo "::error::TC Preview is only published signed: add the signing secrets (docs/android.md)."
          exit 1

      - name: Build TC Preview
        working-directory: android
        run: ./gradlew assembleRelease -PtcPreview --no-daemon --stacktrace

      - name: Publish the TC Preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=timeline-clock-preview.apk
          if [ -n "$PR_NUMBER" ]; then source="PR #$PR_NUMBER ($BRANCH)"; else source="$BRANCH"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk" | tee signing.txt
          {
            echo "**TC Preview**: a separate test app for trying a pull request on the phone before it reaches main. It installs next to Timeline Clock (its own data), and asks which PR's Netlify deploy preview to load; long-press its icon › **Change preview** to switch."
            echo
            echo "Built from $source at \`${HEAD_SHA:0:7}\`. Only native changes need a new build of this app; a PR's web changes show up in its deploy preview by themselves."
            echo
            echo "See [docs/android.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/android.md#testing-a-pull-request-tc-preview)."
            echo
            echo '```'
            grep -i "SHA-256" signing.txt || true
            echo '```'
          } > notes.md
          title="TC Preview (test app)"
          if gh release view "$PREVIEW_TAG" > /dev/null 2>&1; then
            # Update it in place, so the download link never breaks: replace the APK and the
            # notes, then move the tag to this build (only the source archives follow the tag).
            gh release upload "$PREVIEW_TAG" "$apk" --clobber
            gh release edit "$PREVIEW_TAG" --prerelease --title "$title" --notes-file notes.md
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$PREVIEW_TAG" -f sha="$HEAD_SHA" -F force=true > /dev/null \
              || echo "::warning::The APK and notes are updated, but the '$PREVIEW_TAG' tag couldn't be moved to ${HEAD_SHA:0:7}."
          else
            gh release create "$PREVIEW_TAG" "$apk" --prerelease --target "$HEAD_SHA" --title "$title" --notes-file notes.md
          fi
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/$PREVIEW_TAG/$apk" | tee -a "$GITHUB_STEP_SUMMARY"
